# Render blueprint: New > Blueprint, pick this repo.
services:
  - type: web
    name: nash-solver-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: CORS_ORIGINS
        sync: false # set to your Vercel URL, e.g. https://nash-solver.vercel.app
