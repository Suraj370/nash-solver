[project]
name = "nashsolver-api"
version = "0.1.0"
description = "HTTP API for the nashsolver package"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.32", "nashsolver"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv.sources]
nashsolver = { path = "../solver", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
